name: arsenal-news

on:
  schedule:
    - cron: "0 0,12 * * *"   # 07:00 และ 19:00 เวลาไทย -> สรุปข่าว
    - cron: "15,45 * * * *"  # ทุก 30 นาที -> เช็กข่าวด่วน
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [digest, breaking]
        default: digest

permissions:
  contents: write

concurrency: news  # ไม่ให้ 2 รอบเขียน state.json ชนกัน

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python bot.py
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '15,45 * * * *' && 'breaking' || 'digest') }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name news-bot
          git config user.email news-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
